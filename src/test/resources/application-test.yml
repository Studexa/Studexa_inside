spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/studexa_test}
    username: ${DB_USER:studexa}
    password: ${DB_PASSWORD:change_me_locally}
  flyway:
    clean-disabled: false

