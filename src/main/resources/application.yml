spring:
  application:
    name: studexa
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/studexa}
    username: ${DB_USER:studexa}
    password: ${DB_PASSWORD:change_me_locally}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # Dev-only default. Always set JWT_SECRET outside local development (32+ bytes).
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: ${JWT_ISSUER:https://studexa.app}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    refresh-cookie-secure: ${JWT_COOKIE_SECURE:false}
  oauth:
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
    daily-limit: ${AI_DAILY_LIMIT:10}
    max-source-chars: ${AI_MAX_SOURCE_CHARS:12000}
    timeout: ${AI_TIMEOUT:45s}
  security:
    auth-rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      max-requests: ${AUTH_RATE_LIMIT_MAX:30}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.studexa: DEBUG
